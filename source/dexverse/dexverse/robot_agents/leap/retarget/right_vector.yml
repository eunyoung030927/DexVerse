# Vector retargeting: wrist -> fingertip vectors (one per finger),
# the minimal-parameter form (cf. <side>_dexpilot.yml). Auto-generated
# from the dexpilot config so link/joint names stay in sync.
retargeting:
  type: vector
  urdf_path: leap_hand_right_fixed.urdf
  target_origin_link_names:
  - palm_wrist
  - palm_wrist
  - palm_wrist
  - palm_wrist
  target_task_link_names:
  - thumb_tip_head
  - index_tip_head
  - middle_tip_head
  - ring_tip_head
  target_link_human_indices:
  - - 0
    - 0
    - 0
    - 0
  - - 4
    - 8
    - 12
    - 16
  target_joint_names:
  - leap_0
  - leap_1
  - leap_2
  - leap_3
  - leap_4
  - leap_5
  - leap_6
  - leap_7
  - leap_8
  - leap_9
  - leap_10
  - leap_11
  - leap_12
  - leap_13
  - leap_14
  - leap_15
  low_pass_alpha: 0.8
  scaling_factor: 1.3
# DexVerse-only section (dex-retargeting reads just `retargeting`). Narrower limits for the finger optimizer
# only; the simulated hand keeps its full range. With LEAP's +-60 deg abduction and PIP/DIP hyperextension,
# tip-only objectives reached fist targets by swinging fingers sideways and bending PIPs backwards.
dexverse:
  joint_limit_overrides:
    leap_0: [-0.35, 0.35]
    leap_4: [-0.35, 0.35]
    leap_8: [-0.35, 0.35]
    leap_2: [0.0, 1.885]
    leap_6: [0.0, 1.885]
    leap_10: [0.0, 1.885]
    leap_3: [0.0, 2.042]
    leap_7: [0.0, 2.042]
    leap_11: [0.0, 2.042]
