# Vector retargeting: wrist -> fingertip vectors (one per finger),
# the minimal-parameter form (cf. <side>_dexpilot.yml). Auto-generated
# from the dexpilot config so link/joint names stay in sync.
retargeting:
  type: vector
  urdf_path: wuji_hand_right.urdf
  target_origin_link_names:
  - right_palm_link
  - right_palm_link
  - right_palm_link
  - right_palm_link
  - right_palm_link
  target_task_link_names:
  - right_finger1_tip_link
  - right_finger2_tip_link
  - right_finger3_tip_link
  - right_finger4_tip_link
  - right_finger5_tip_link
  target_link_human_indices:
  - - 0
    - 0
    - 0
    - 0
    - 0
  - - 4
    - 8
    - 12
    - 16
    - 20
  target_joint_names:
  - right_finger1_joint1
  - right_finger1_joint2
  - right_finger1_joint3
  - right_finger1_joint4
  - right_finger2_joint1
  - right_finger2_joint2
  - right_finger2_joint3
  - right_finger2_joint4
  - right_finger3_joint1
  - right_finger3_joint2
  - right_finger3_joint3
  - right_finger3_joint4
  - right_finger4_joint1
  - right_finger4_joint2
  - right_finger4_joint3
  - right_finger4_joint4
  - right_finger5_joint1
  - right_finger5_joint2
  - right_finger5_joint3
  - right_finger5_joint4
  low_pass_alpha: 0.8
  scaling_factor: 1.3
# DexVerse-only section (dex-retargeting reads just `retargeting`).
# Global heading is -15 / +15 deg (Shadow). On the Quest recording an open Wuji hand leans all
# abductions to one side at -15 deg; -6 / +6 deg gives the lowest DexPilot tip error (open + fist).
# Abduction of fingers 2-5 may not go thumb-ward (finger optimizer only; the simulated hand keeps its range):
# DexPilot otherwise pinned every abduction at its thumb-side limit in a fist, so the curled fingers leaned
# toward the thumb instead of converging on the middle finger as the tilted MCP axes make them do.
dexverse:
  finger_z_rotation_deg: -6.0
  joint_limit_overrides:
    right_finger2_joint2: [-0.37, 0.0]
    right_finger3_joint2: [-0.37, 0.0]
    right_finger4_joint2: [-0.37, 0.0]
    right_finger5_joint2: [-0.37, 0.0]
