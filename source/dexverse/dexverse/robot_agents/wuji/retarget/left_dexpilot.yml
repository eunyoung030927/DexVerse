retargeting:
  type: DexPilot
  urdf_path: wuji_hand_left.urdf
  wrist_link_name: left_palm_link
  finger_tip_link_names:
  - left_finger1_tip_link
  - left_finger2_tip_link
  - left_finger3_tip_link
  - left_finger4_tip_link
  - left_finger5_tip_link
  low_pass_alpha: 0.8
  scaling_factor: 1.15
  target_joint_names:
  - left_finger1_joint1
  - left_finger1_joint2
  - left_finger1_joint3
  - left_finger1_joint4
  - left_finger2_joint1
  - left_finger2_joint2
  - left_finger2_joint3
  - left_finger2_joint4
  - left_finger3_joint1
  - left_finger3_joint2
  - left_finger3_joint3
  - left_finger3_joint4
  - left_finger4_joint1
  - left_finger4_joint2
  - left_finger4_joint3
  - left_finger4_joint4
  - left_finger5_joint1
  - left_finger5_joint2
  - left_finger5_joint3
  - left_finger5_joint4
# DexVerse-only section (dex-retargeting reads just `retargeting`).
# Global heading is -15 / +15 deg (Shadow). On the Quest recording an open Wuji hand leans all
# abductions to one side at -15 deg; -6 / +6 deg gives the lowest DexPilot tip error (open + fist).
# Abduction of fingers 2-5 may not go thumb-ward (finger optimizer only; the simulated hand keeps its range):
# DexPilot otherwise pinned every abduction at its thumb-side limit in a fist, so the curled fingers leaned
# toward the thumb instead of converging on the middle finger as the tilted MCP axes make them do.
dexverse:
  finger_z_rotation_deg: 6.0
  joint_limit_overrides:
    left_finger2_joint2: [0.0, 0.37]
    left_finger3_joint2: [0.0, 0.37]
    left_finger4_joint2: [0.0, 0.37]
    left_finger5_joint2: [0.0, 0.37]
