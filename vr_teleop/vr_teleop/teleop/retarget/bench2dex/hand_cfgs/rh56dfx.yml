retargeting:
  type: DexPilot
  scaling_factor: 1.07
  project_dist: 0.01
  escape_dist: 0.02
  low_pass_alpha: 0.5  # 2026-10-28: was 0.2 (~5 frames lag); faster tracking

  hand_offset_xyz: [0, 0, 0.04]
  hand_scale_xyz: [1, 1.0, 1.0]
  # Quest/OpenXR (--teleop-device quest): metric hand joints, so the Manus-tuned scale above
  # does not apply. Uniform scale = robot/human open-hand wrist->tip length for an average
  # adult hand (~19 cm wrist->middle tip); tune per operator (hot-reloaded).
  xr_hand_scale_xyz: [1.14, 1.14, 1.14]
  xr_hand_offset_xyz: [0, 0, 0]
  mano_correction_vis: true

  # Mimic joints are already handled in Isaac Sim USD, so ignore them in dex_retargeting
  # 2026-10-28: the mimic joints (finger _2, thumb_3 / _4) are modelled INSIDE the optimisation (dex-retargeting mimic
  # adaptor). With them ignored DexPilot planned with straight distal segments and the thumb-index pinch stayed
  # 5 cm open (operator recording); with the adaptor it closes to 0.9 cm. The adaptor needs single-level mimic
  # chains, so the URDFs used here are local copies (hand_cfgs/ur5+RH56DFX/urdf/, thumb_4 -> thumb_2 directly).
  ignore_mimic_joint: false

  right:
    urdf_path: ur5+RH56DFX/urdf/Right_Hand.urdf
    wrist_link_name: "r_base_link"
    finger_tip_link_names:
      - right_thumb_tip
      - right_index_tip
      - right_middle_tip
      - right_ring_tip
      - right_little_tip
    target_joint_names:
      - right_thumb_1_joint
      - right_thumb_2_joint
      - right_index_1_joint
      - right_middle_1_joint
      - right_ring_1_joint
      - right_little_1_joint
    mano_to_pinocchio_rpy: [1.5708, -1.5708, 0]
    sim_wrist_to_pin_root_rpy: [0, 0, 0]

  left:
    urdf_path: ur5+RH56DFX/urdf/Left_Hand.urdf
    wrist_link_name: "l_base_link"
    finger_tip_link_names:
      - left_thumb_tip
      - left_index_tip
      - left_middle_tip
      - left_ring_tip
      - left_little_tip
    target_joint_names:
      - left_thumb_1_joint
      - left_thumb_2_joint
      - left_index_1_joint
      - left_middle_1_joint
      - left_ring_1_joint
      - left_little_1_joint
    mano_to_pinocchio_rpy: [-1.5708, -1.5708, 0]
    sim_wrist_to_pin_root_rpy: [0, 0, 0]
