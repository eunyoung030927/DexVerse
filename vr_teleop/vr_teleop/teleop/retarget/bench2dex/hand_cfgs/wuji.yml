retargeting:
  type: DexPilot
  scaling_factor: 1.0
  project_dist: 0.01
  escape_dist: 0.02
  low_pass_alpha: 0.5  # 2026-10-28: was 0.2 (~5 frames lag); faster tracking

  hand_offset_xyz: [0, 0, 0]
  hand_scale_xyz: [1.5, 1.0, 1.2]   # 2026-10-28: 2.0 -> 1.5 (fist PIP/DIP 23 -> 36 deg with the joint-angle prior, pinch 1.2 cm)
  # Quest/OpenXR (--teleop-device quest): metric hand joints, so the Manus-tuned scale above
  # does not apply. Uniform scale = robot/human open-hand wrist->tip length for an average
  # adult hand (~19 cm wrist->middle tip); tune per operator (hot-reloaded).
  xr_hand_scale_xyz: [1.10, 1.10, 1.10]
  mano_correction_vis: true

  joint_limits_override:

  right:
    urdf_path: ur5+wuji/urdf/Right_Hand.urdf
    wrist_link_name: "right_palm_link"
    finger_tip_link_names:
      - right_finger1_tip_link
      - right_finger2_tip_link
      - right_finger3_tip_link
      - right_finger4_tip_link
      - right_finger5_tip_link
    mano_to_pinocchio_rpy: [1.5708, -1.5708, 0]
    sim_wrist_to_pin_root_rpy: [0, 0, 0]

  left:
    urdf_path: ur5+wuji/urdf/Left_Hand.urdf
    wrist_link_name: "left_palm_link"
    finger_tip_link_names:
      - left_finger1_tip_link
      - left_finger2_tip_link
      - left_finger3_tip_link
      - left_finger4_tip_link
      - left_finger5_tip_link
    mano_to_pinocchio_rpy: [-1.5708, -1.5708, 0]
    sim_wrist_to_pin_root_rpy: [0, 0, 0]
