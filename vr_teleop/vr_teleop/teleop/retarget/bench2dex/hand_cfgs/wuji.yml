retargeting:
  type: DexPilot
  scaling_factor: 1.0
  project_dist: 0.01
  escape_dist: 0.02
  low_pass_alpha: 0.2

  hand_offset_xyz: [0, 0, 0]
  hand_scale_xyz: [2.0, 1.0, 1.2]
  # Quest/OpenXR (--teleop-device quest): metric hand joints, so the Manus-tuned scale above
  # does not apply. Uniform scale = robot/human open-hand wrist->tip length for an average
  # adult hand (~19 cm wrist->middle tip); tune per operator (hot-reloaded).
  xr_hand_scale_xyz: [1.10, 1.10, 1.10]
  mano_correction_vis: true

  # 2026-10-26: with fingertip-only DexPilot the 4-DoF Wuji fingers flexed almost only at joint1 (MCP): on a recorded
  # open->fist glove motion joint1 moved 1.2 rad while joint3/joint4 (PIP/DIP) moved < 0.1 rad, so the hand looked
  # like one axis per finger. PIP/DIP now follow MCP (joint3 = 0.9 x, joint4 = 0.7 x of MCP's normalised flexion,
  # starting above 0.4 rad MCP); the flexion joints are limited to [0, 1.55] so the coupling never hyperextends.
  # The thumb (finger1) is left to DexPilot. Offline check (old glove profile): fist joint3 ~1.25, joint4 ~0.95 rad.
  joint_limits_override:
    right_finger2_joint1: [0.4, 1.55]
    right_finger2_joint3: [0, 1.55]
    right_finger2_joint4: [0, 1.55]
    right_finger3_joint1: [0.4, 1.55]
    right_finger3_joint3: [0, 1.55]
    right_finger3_joint4: [0, 1.55]
    right_finger4_joint1: [0.4, 1.55]
    right_finger4_joint3: [0, 1.55]
    right_finger4_joint4: [0, 1.55]
    right_finger5_joint1: [0.4, 1.55]
    right_finger5_joint3: [0, 1.55]
    right_finger5_joint4: [0, 1.55]
    left_finger2_joint1: [0.4, 1.55]
    left_finger2_joint3: [0, 1.55]
    left_finger2_joint4: [0, 1.55]
    left_finger3_joint1: [0.4, 1.55]
    left_finger3_joint3: [0, 1.55]
    left_finger3_joint4: [0, 1.55]
    left_finger4_joint1: [0.4, 1.55]
    left_finger4_joint3: [0, 1.55]
    left_finger4_joint4: [0, 1.55]
    left_finger5_joint1: [0.4, 1.55]
    left_finger5_joint3: [0, 1.55]
    left_finger5_joint4: [0, 1.55]
  joint_coupling:
    - {source: right_finger2_joint1, targets: [right_finger2_joint3], ratio: 0.9}
    - {source: right_finger2_joint1, targets: [right_finger2_joint4], ratio: 0.7}
    - {source: right_finger3_joint1, targets: [right_finger3_joint3], ratio: 0.9}
    - {source: right_finger3_joint1, targets: [right_finger3_joint4], ratio: 0.7}
    - {source: right_finger4_joint1, targets: [right_finger4_joint3], ratio: 0.9}
    - {source: right_finger4_joint1, targets: [right_finger4_joint4], ratio: 0.7}
    - {source: right_finger5_joint1, targets: [right_finger5_joint3], ratio: 0.9}
    - {source: right_finger5_joint1, targets: [right_finger5_joint4], ratio: 0.7}
    - {source: left_finger2_joint1, targets: [left_finger2_joint3], ratio: 0.9}
    - {source: left_finger2_joint1, targets: [left_finger2_joint4], ratio: 0.7}
    - {source: left_finger3_joint1, targets: [left_finger3_joint3], ratio: 0.9}
    - {source: left_finger3_joint1, targets: [left_finger3_joint4], ratio: 0.7}
    - {source: left_finger4_joint1, targets: [left_finger4_joint3], ratio: 0.9}
    - {source: left_finger4_joint1, targets: [left_finger4_joint4], ratio: 0.7}
    - {source: left_finger5_joint1, targets: [left_finger5_joint3], ratio: 0.9}
    - {source: left_finger5_joint1, targets: [left_finger5_joint4], ratio: 0.7}

  right:
    urdf_path: ur5+wuji/urdf/Right_Hand.urdf
    wrist_link_name: "right_palm_link"
    finger_tip_link_names:
      - right_finger1_tip_link
      - right_finger2_tip_link
      - right_finger3_tip_link
      - right_finger4_tip_link
      - right_finger5_tip_link
    mano_to_pinocchio_rpy: [1.5708, -1.5708, 0]
    sim_wrist_to_pin_root_rpy: [0, 0, 0]

  left:
    urdf_path: ur5+wuji/urdf/Left_Hand.urdf
    wrist_link_name: "left_palm_link"
    finger_tip_link_names:
      - left_finger1_tip_link
      - left_finger2_tip_link
      - left_finger3_tip_link
      - left_finger4_tip_link
      - left_finger5_tip_link
    mano_to_pinocchio_rpy: [-1.5708, -1.5708, 0]
    sim_wrist_to_pin_root_rpy: [0, 0, 0]
