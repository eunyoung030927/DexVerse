    left_middle_2_joint: {features: {middle_mcp: 1.0, middle_pip: 0.5}, offset: 0.0, min: 0.0, max: 1.60}   # mimic in sim
    left_ring_1_joint: {features: {ring_mcp: 1.0, ring_pip: 0.5}, offset: 0.0, min: 0.0, max: 1.34}
    left_ring_2_joint: {features: {ring_mcp: 1.0, ring_pip: 0.5}, offset: 0.0, min: 0.0, max: 1.60}   # mimic in sim
    left_little_1_joint: {features: {little_mcp: 1.0, little_pip: 0.5}, offset: 0.0, min: 0.0, max: 1.34}
    left_little_2_joint: {features: {little_mcp: 1.0, little_pip: 0.5}, offset: 0.0, min: 0.0, max: 1.60}   # mimic in sim
    left_thumb_1_joint: {features: {}, offset: 0.0, min: 0.0, max: 1.31}   # DexPilot
