# Manus / OpenXR hand joint angles -> Shadow joints (direct linear map, see ../angle_retargeter.py).
# Units rad. q = sum(gain * feature) + offset, clipped to [min, max]. Hot-reloaded while teleop runs.
# 2026-10-28: flexion joints follow the matching human joint 1:1 (flexion positive, checked against the DexPilot
# reference); abduction / spread joints held at 0 until their sign is checked in VR; the thumb joints follow the
# human thumb angles too (sign / offset fitted against DexPilot on the 2026-10-28 recording); the glove reports thumb
# MCP ~ 0, so the robot thumb MCP also takes 0.5 x thumb IP. Human little finger -> LF (little finger).
low_pass_alpha: 0.6
# DexPilot (default teleop backend) adds lambda * sum (q - theta)^2 with theta = this joint map (see
# bench2dex_finger_retargeter._install_prior); weights of the thumb and of a finger pinching the thumb are scaled
# by pinch_scale between start_cm and full_cm so pinches close exactly. lambda 0 = plain DexPilot.
prior: {lambda: 0.05, pinch_scale: 0.1, start_cm: 3.0, full_cm: 1.5}
pinch_blend: {fingers: [index, middle, ring], start_cm: 3.0, full_cm: 1.5}   # also the prior's pinch gate
# policy 2026-10-28: the four fingers follow the human joint angles 1:1; the thumb is the position-based
# DexPilot solution (dexpilot_joints), seeded from the angle posture every frame. No pinch blend.

dexpilot_joints: ["THJ5", "THJ4", "THJ3", "THJ2", "THJ1"]
joints:
  WRJ2: {features: {}, offset: 0.0, min: -0.52, max: 0.17}
  WRJ1: {features: {}, offset: 0.0, min: -0.7, max: 0.49}   # wrist joints stay at 0 (the floating wrist moves the hand)
  FFJ4: {features: {index_spread: -1.0}, offset: 0.0, min: -0.35, max: 0.35}   # abduction, sign by FK 2026-10-28
  FFJ3: {features: {index_mcp: 1.0}, offset: 0.0, min: -0.26, max: 1.57}
  FFJ2: {features: {index_pip: 1.0}, offset: 0.0, min: 0.0, max: 1.57}
  FFJ1: {features: {index_dip: 1.0}, offset: 0.0, min: 0.0, max: 1.57}
  MFJ4: {features: {middle_spread: -1.0}, offset: 0.0, min: -0.35, max: 0.35}   # abduction, sign by FK 2026-10-28
  MFJ3: {features: {middle_mcp: 1.0}, offset: 0.0, min: -0.26, max: 1.57}
  MFJ2: {features: {middle_pip: 1.0}, offset: 0.0, min: 0.0, max: 1.57}
  MFJ1: {features: {middle_dip: 1.0}, offset: 0.0, min: 0.0, max: 1.57}
  RFJ4: {features: {ring_spread: +1.0}, offset: 0.0, min: -0.35, max: 0.35}   # abduction, sign by FK 2026-10-28
  RFJ3: {features: {ring_mcp: 1.0}, offset: 0.0, min: -0.26, max: 1.57}
  RFJ2: {features: {ring_pip: 1.0}, offset: 0.0, min: 0.0, max: 1.57}
  RFJ1: {features: {ring_dip: 1.0}, offset: 0.0, min: 0.0, max: 1.57}
  LFJ4: {features: {little_spread: +1.0}, offset: 0.0, min: -0.35, max: 0.35}   # abduction, sign by FK 2026-10-28
  LFJ3: {features: {little_mcp: 1.0}, offset: 0.0, min: -0.26, max: 1.57}
  LFJ2: {features: {little_pip: 1.0}, offset: 0.0, min: 0.0, max: 1.57}
  LFJ1: {features: {little_dip: 1.0}, offset: 0.0, min: 0.0, max: 1.57}
  LFJ5: {features: {}, offset: 0.0, min: 0.0, max: 0.79}   # palm arch
  THJ5: {features: {thumb_oppose: -2.00}, offset: 1.55, min: -1.05, max: 1.05}   # thumb, joint map (fitted sign/offset 2026-10-28)
  THJ4: {features: {thumb_abd: 0.83}, offset: 0.06, min: 0.0, max: 1.22}   # thumb, joint map (fitted sign/offset 2026-10-28)
  THJ3: {features: {}, offset: 0.0, min: -0.21, max: 0.21}   # thumb, joint map (fitted sign/offset 2026-10-28)
  THJ2: {features: {thumb_mcp: 0.50, thumb_ip: 0.25}, offset: -0.02, min: -0.7, max: 0.7}   # thumb, joint map (fitted sign/offset 2026-10-28)
  THJ1: {features: {thumb_ip: 1.00}, offset: -0.00, min: -0.26, max: 1.57}   # thumb, joint map (fitted sign/offset 2026-10-28)
